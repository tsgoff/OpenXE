name: Security

on:
  push:
    branches: [ main, master, develop, codequality ]
  pull_request:
    branches: [ main, master, develop, codequality ]
  schedule:
    # Jeden Montag um 9 Uhr
    - cron: '0 9 * * 1'

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check for known vulnerabilities (Composer)
        run: composer audit --format=json
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check for known vulnerabilities (NPM)
        run: |
          if [ -f "package-lock.json" ]; then
            npm audit --audit-level=moderate
          fi
        continue-on-error: true

  static-analysis-security:
    name: Static Analysis Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: gd, curl, soap, mbstring, xml

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan with strict rules
        run: composer phpstan
        continue-on-error: true

  dependabot-auto:
    name: Dependabot Auto-merge
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    needs: [dependency-scan, static-analysis-security]
    
    permissions:
      pull-requests: write
      contents: write
      
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v1
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-merge Dependabot PRs (patch and minor)
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
